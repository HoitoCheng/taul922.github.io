<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 8px;
  }
  .cal { width: 100%; max-width: 300px; }
  .header {
    background: #111; color: #fff;
    border-radius: 12px 12px 0 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
  }
  .header .title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
  .header .nav { display: flex; gap: 4px; }
  .header .nav button {
    border: none; background: transparent; color: #fff;
    font-size: 14px; cursor: pointer; padding: 2px 8px; border-radius: 6px;
  }
  .header .nav button:hover { background: rgba(255,255,255,0.15); }
  .body {
    background: #fff; border: 1px solid #eee; border-top: none;
    border-radius: 0 0 12px 12px; padding: 12px 10px 10px;
  }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .weekdays { margin-bottom: 6px; }
  .weekdays span {
    text-align: center; font-size: 10px; font-weight: 700;
    color: #999; padding: 3px 0;
  }
  .days span {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #333; border-radius: 50%; cursor: default;
  }
  .days span.other { color: #ddd; }
  .days span.today {
    background: #111; color: #fff; font-weight: 700;
  }
  .days span:not(.other):not(.today):hover { background: #f5f5f5; }
</style>
</head>
<body>
<div class="cal">
  <div class="header">
    <div class="nav"><button id="prev">‹</button></div>
    <div class="title" id="title"></div>
    <div class="nav"><button id="next">›</button></div>
  </div>
  <div class="body">
    <div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="days" id="days"></div>
  </div>
</div>
<script>
  const titleEl = document.getElementById('title');
  const daysEl = document.getElementById('days');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  let vy = now.getFullYear(), vm = now.getMonth();
  function render() {
    titleEl.textContent = months[vm] + ' ' + vy;
    daysEl.innerHTML = '';
    const first = new Date(vy, vm, 1).getDay();
    const dim = new Date(vy, vm + 1, 0).getDate();
    const pdim = new Date(vy, vm, 0).getDate();
    for (let i = first - 1; i >= 0; i--) {
      const s = document.createElement('span'); s.className = 'other'; s.textContent = pdim - i;
      daysEl.appendChild(s);
    }
    for (let d = 1; d <= dim; d++) {
      const s = document.createElement('span'); s.textContent = d;
      if (d === now.getDate() && vm === now.getMonth() && vy === now.getFullYear()) s.className = 'today';
      daysEl.appendChild(s);
    }
    const tail = (7 - (first + dim) % 7) % 7;
    for (let d = 1; d <= tail; d++) {
      const s = document.createElement('span'); s.className = 'other'; s.textContent = d;
      daysEl.appendChild(s);
    }
  }
  document.getElementById('prev').onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } render(); };
  document.getElementById('next').onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } render(); };
  render();
</script>
</body>
</html>
