<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 8px;
  }
  .clock { text-align: center; width: 100%; max-width: 280px; padding-top: 10px; }
  .bunny { font-size: 44px; margin-bottom: 6px; }
  .time {
    font-size: 42px; font-weight: 800; color: #111;
    letter-spacing: 2px; font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .date { margin-top: 8px; font-size: 13px; color: #888; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="clock">
  <div class="bunny">🐰</div>
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date"></div>
</div>
<script>
  const week = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick() {
    const n = new Date(), p = x => String(x).padStart(2, '0');
    document.getElementById('time').textContent = p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
    document.getElementById('date').textContent = week[n.getDay()] + ', ' + months[n.getMonth()] + ' ' + n.getDate();
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
