<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 8px;
  }
  .pomo { text-align: center; width: 100%; max-width: 280px; }
  .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .modes button {
    border: 1.5px solid #222; background: transparent; color: #222;
    font-size: 11px; font-weight: 600; padding: 6px 14px;
    border-radius: 20px; cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .modes button.active { background: #222; color: #fff; }
  .time {
    font-size: 64px; font-weight: 800; color: #111;
    letter-spacing: 1px; font-variant-numeric: tabular-nums;
    line-height: 1; margin-bottom: 20px;
  }
  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; }
  #startBtn {
    border: none; background: #111; color: #fff;
    font-size: 14px; font-weight: 600; padding: 10px 32px;
    border-radius: 24px; cursor: pointer; font-family: inherit;
    transition: background 0.15s;
  }
  #startBtn:hover { background: #333; }
  .icon-btn {
    border: none; background: transparent; cursor: pointer;
    font-size: 20px; color: #111; padding: 6px;
  }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: #e0e0e0; }
  .dots span.done { background: #111; }
</style>
</head>
<body>
<div class="pomo">
  <div class="modes">
    <button data-min="25" class="active">Pomodoro</button>
    <button data-min="5">Short Break</button>
    <button data-min="15">Long Break</button>
  </div>
  <div class="time" id="time">25:00</div>
  <div class="controls">
    <button id="startBtn">Start</button>
    <button class="icon-btn" id="resetBtn" title="Reset">↻</button>
  </div>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
</div>
<script>
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.modes button');
  const dots = document.querySelectorAll('#dots span');
  let totalSec = 25 * 60, remain = totalSec, timer = null, running = false, completed = 0;
  const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  const draw = () => timeEl.textContent = fmt(remain);
  function stop() { clearInterval(timer); timer = null; running = false; startBtn.textContent = 'Start'; }
  modeBtns.forEach(b => b.onclick = () => {
    modeBtns.forEach(x => x.classList.remove('active'));
    b.classList.add('active'); stop();
    totalSec = remain = parseInt(b.dataset.min) * 60; draw();
  });
  startBtn.onclick = () => {
    if (running) { stop(); return; }
    running = true; startBtn.textContent = 'Pause';
    timer = setInterval(() => {
      if (--remain <= 0) {
        stop(); remain = totalSec; draw();
        completed = (completed + 1) % 5;
        dots.forEach((d, i) => d.classList.toggle('done', i < completed));
        return;
      }
      draw();
    }, 1000);
  };
  resetBtn.onclick = () => { stop(); remain = totalSec; draw(); };
  draw();
</script>
</body>
</html>
